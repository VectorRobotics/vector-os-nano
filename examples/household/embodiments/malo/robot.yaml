schema: 1
display_name: Zeno Malo EDU — contact-only development configuration
world: artvip_home
model: {file: physical.xml, root_body: base_link}
initial_joints:
  head_pitch_joint: 0.28
  left_arm_joint_2: 0.02
  right_arm_joint_2: 0.02
  left_gripper_left_finger_axis: 0.04
  left_gripper_right_finger_axis: 0.04
  right_gripper_left_finger_axis: 0.04
  right_gripper_right_finger_axis: 0.04

joint_groups:
  torso:
    joints: [torso_lift_joint, waist_pitch_joint]
    postures: {upright: [0, 0], shelf: [-0.15, 0.2], grasp: [-0.15, 0.3], carry: [-0.03, 0.3]}
    velocity: [0.04, 0.15]
    acceleration: [0.1, 0.3]
    jerk: [0.3, 0.8]
    track_tol: 0.003
  head:
    joints: [head_yaw_joint, head_pitch_joint]
    postures: {forward: [0, 0.28], level: [0, 0], left: [0.5, 0.28], right: [-0.5, 0.28]}
    velocity: [0.25, 0.2]
    acceleration: [0.5, 0.4]
    jerk: [1, 0.8]
    track_tol: 0.01

# The complete dual-arm CAD is retained. This first control acceptance uses the
# left arm; named dual-end-effector routing is still a separate integration gate.
base:
  height: 0.0
  holonomic: true
  limits: {vx: 0.25, vy: 0.18, vyaw: 0.3}
  fall_z: -0.05
  fall_tilt_deg: 5
  joints: [fl_steering_joint, fl_wheel_joint, fr_steering_joint, fr_wheel_joint,
           rl_steering_joint, rl_wheel_joint, rr_steering_joint, rr_wheel_joint]
  stance: {fl_steering_joint: 0, fl_wheel_joint: 0, fr_steering_joint: 0, fr_wheel_joint: 0,
           rl_steering_joint: 0, rl_wheel_joint: 0, rr_steering_joint: 0, rr_wheel_joint: 0}
  postures: {}
  kp: 5
  kd: 0.08
  policy:
    ref: swerve
    timestep: 0.001
    tick_hz: 1000
    wheels: [[0.155, 0.155, 0.04105, 0.00175], [0.155, -0.155, 0.04105, -0.00175],
             [-0.155, 0.155, 0.04105, 0.00175], [-0.155, -0.155, 0.04105, -0.00175]]
    steering_range: [-2.5, 2.5]
    steering_kp: 5
    steering_kd: 0.08
    steering_speed: 0.6
    wheel_kp: 0.04
    wheel_ki: 0.4
    wheel_speed: 8.5
    accel: 0.25
    yaw_accel: 0.5
  nav: {body_radius: 0.42, speed: 0.15, vyaw_max: 0.2, goal_tol: 0.1}

# CAD mount; FOV and pinhole intrinsics are estimates, not hardware calibration.
sensors:
  - {role: camera, name: head, width: 640, height: 480, depth: [0.1, 10]}

arm:
  joints: [left_arm_joint_1, left_arm_joint_2, left_arm_joint_3, left_arm_joint_4,
           left_arm_joint_5, left_arm_joint_6, left_arm_joint_7]
  ee: {site: left_tcp}
  home: [0, 0.02, 0, 0, 0, 0, 0]
  postures:
    view: [0, 1.3, 0, 0, 0, 0, 0]
    ready: [1.161645, 0.464856, -0.290585, 1.956293, 0.356246, 0.418494, -1.100954]
    carry: [1.479768, 0.288223, -0.462846, 1.034174, 0.488806, 0.226523, -1.345749]
  ik_seeds:
    - [0.830821, 0.466810, -0.278776, 1.985945, 0.349220, 0.418516, -0.801439]
    - [1.623591, 0.177835, -0.461413, 0.591654, 0.483206, 0.097755, -1.061508]
  track_tol: 0.04
  ik_tolerance: 0.0001
  velocity: [0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35]
  acceleration: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
  jerk: [2, 2, 2, 2, 2, 2, 2]
  gripper:
    joint: left_gripper_left_finger_axis
    open: 0.04
    closed: 0
    finger_bodies: [left_gripper_left_finger_link, left_gripper_right_finger_link]
    weld_body: left_gripper_link
    min_opening: 0.002
    assist: false
    speed: 0.02
    force_feedback: true  # ideal simulated fingertip load sensing; hardware not calibrated

skills:
  transport: {posture: carry, duration: 6.0, minimum_load: 0.3, max_force: 6.0}
  grasp:
    pre_grasp_height: 0.07
    grasp_z_above: 0.016
    lift_height: 0.09
    approach_back: 0.1
    durations: [5, 3, 5, 8]
    reach_m: 0.65
    view_duration: 3
    hold_duration: 2
    # Development: aligned rigid packages, observed RGB-D bounds, contact-only.
    frontal:
      pre_offset: [-0.11, 0, 0.1]
      contact_offset: [-0.02, 0, 0.035]
      pitch: 0.7853981633974483
      ready_posture: ready
      prepare: {group: torso, posture: grasp}
      lift: {group: torso, posture: carry}
    base:
      standoff: 0.68
      lateral_offset: 0.20
      view_standoff: 1.05
      step_speed: 0.06
      step_duration: 1.0
      approach_steps: 20
      stall_distance: 0.005
      seat_steps: 0
      seat_distance: 0.005
      lateral_gain: 0.5
      lateral_speed: 0.04
      lateral_deadband: 0.015
      yaw_speed: 0.10
      yaw_deadband: 0.02
      scan_steps: 0
      scan_step: 0.3
      scan_range: 2.0
      retries: 1

  place:
    hover_height: 0.18
    release_height: 0.09  # estimated TCP-to-package-bottom clearance for the frontal grasp
    retreat_height: 0.10
    durations: [6.0, 6.0, 6.0]
    settle_duration: 2.0
    reach_m: 0.70
    position_tolerance: 0.01
    keep_orientation: true
    support: {max_descent: 0.015, step: 0.0005, duration: 0.4, dwell: 0.6,
              minimum_load: 0.3, unload_fraction: 0.2, max_force: 6.0}
