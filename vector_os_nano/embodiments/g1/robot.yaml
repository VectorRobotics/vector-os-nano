    motion.pt: deploy/pre_train/g1/motion.pt
    g1_12dof.xml: resources/robots/g1_description/g1_12dof.xml
    scene.xml: resources/robots/g1_description/scene.xml
    meshes: resources/robots/g1_description/meshes
  sha256:                         # every file the robot loads; exactly these are copied
