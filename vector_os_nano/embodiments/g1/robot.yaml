model:
  file: g1_12dof.xml              # relative to the asset folder
  root_body: pelvis

base:
  height: 0.78                    # the pelvis height it stands at, stepping in place (measured)
  holonomic: false                # it turns to walk where it goes (the follower never strafes it)
  limits: {vx: 0.8, vy: 0.4, vyaw: 1.0}
  fall_z: 0.4                     # fallen: the pelvis below this,
  fall_tilt_deg: 45.0             # or its up axis tilted past this
  # The order the policy sees: per leg (left, right) hip pitch, roll, yaw, knee, ankle pitch, roll.
  joints: [left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint, left_knee_joint,
           left_ankle_pitch_joint, left_ankle_roll_joint, right_hip_pitch_joint, right_hip_roll_joint,
           right_hip_yaw_joint, right_knee_joint, right_ankle_pitch_joint, right_ankle_roll_joint]
  stance: {left_hip_pitch_joint: -0.1, left_hip_roll_joint: 0.0, left_hip_yaw_joint: 0.0,
           left_knee_joint: 0.3, left_ankle_pitch_joint: -0.2, left_ankle_roll_joint: 0.0,
           right_hip_pitch_joint: -0.1, right_hip_roll_joint: 0.0, right_hip_yaw_joint: 0.0,
           right_knee_joint: 0.3, right_ankle_pitch_joint: -0.2, right_ankle_roll_joint: 0.0}
  # No sit / lie postures: the stance is the policy's own (it balances, stepping in place).
  kp: {left_hip_pitch_joint: 100, left_hip_roll_joint: 100, left_hip_yaw_joint: 100,
       left_knee_joint: 150, left_ankle_pitch_joint: 40, left_ankle_roll_joint: 40,
       right_hip_pitch_joint: 100, right_hip_roll_joint: 100, right_hip_yaw_joint: 100,
       right_knee_joint: 150, right_ankle_pitch_joint: 40, right_ankle_roll_joint: 40}
  kd: {left_hip_pitch_joint: 2, left_hip_roll_joint: 2, left_hip_yaw_joint: 2,
       left_knee_joint: 4, left_ankle_pitch_joint: 2, left_ankle_roll_joint: 2,
       right_hip_pitch_joint: 2, right_hip_roll_joint: 2, right_hip_yaw_joint: 2,
       right_knee_joint: 4, right_ankle_pitch_joint: 2, right_ankle_roll_joint: 2}
  policy:
    ref: torchscript              # needs torch: uv pip install -e '.[perception]'
    timestep: 0.002
    tick_hz: 500                  # PD every physics step, as the deploy script runs it
    file: motion.pt
    decimation: 10                # the network every 10 ticks: 50 Hz
    obs:                          # 47 = 3 + 3 + 3 + 12 + 12 + 12 + 2
      - {term: base_ang_vel, scale: 0.25}
      - {term: projected_gravity, scale: 1.0}
      - {term: command, scale: [2.0, 2.0, 0.25]}
      - {term: joint_pos_rel, scale: 1.0}
      - {term: joint_vel, scale: 0.05}
      - {term: last_action, scale: 1.0}
      - {term: gait_phase, scale: 1.0, period: 0.8}
    action: {scale: 0.25}
  nav:
    # The in-process follower (sim/nav/follow.py).
    body_radius: 0.30             # planning inflation (~0.27 m wide + its sway)
    speed: 0.5                    # m/s forward
    vyaw_max: 0.6                 # rad/s
    goal_tol: 0.30                # m: its sway

sensors:
  # A head camera on the pelvis (0.04 m ahead, 0.42 m up, looking along +x), depth over
  # the D435's range like the go2's.
  - role: camera
    name: head_rgb
    body: pelvis
    pos: [0.04, 0.0, 0.42]
    quat: [0.5, 0.5, -0.5, -0.5]  # camera x = -y (right), y = +z (up): it looks along +x
    width: 640
    height: 480
    depth: [0.1, 10.0]
  # A lidar 0.72 m above the pelvis (~1.5 m: above every leg geom).
  - role: lidar
    body: pelvis
    pos: [0.0, 0.0, 0.72]
    tilt_deg: -10.0
    elevations_deg: [-8, -5, -2, 0, 1, 4, 7, 10, 13, 16, 19, 22, 25, 28]
    n_azimuth: 360
    range: 15.0
    period_s: 0.2                 # 5 Hz of sim time
