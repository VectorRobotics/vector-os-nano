# Unitree G1 humanoid, its 12 leg joints walked by the unitree_rl_gym policy (motion.pt).
# The generic LeggedBase (sim/drivers/base.py) drives it from the `base` block below
# with the `torchscript` policy row; every name is the exact name in g1_12dof.xml. The
# policy numbers are those of the script it was trained under (unitree_rl_gym
# deploy/deploy_mujoco, configs/g1.yaml, at the pinned revision of `assets`).

display_name: "Unitree G1 (humanoid, 12-DoF)"
world: apartment          # worlds/apartment/world.yaml

assets:
  # Not shipped: fetched by `python scripts/fetch_assets.py g1` into
  # ~/.vector/assets/g1_gait. model.file and base.policy.file are
  # relative to that folder (vector_os_nano/embodiments/assets.py).
