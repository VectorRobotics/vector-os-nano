# SO-101 5-DoF tabletop arm + gripper — embodiment manifest. Fixed base on the
# so101_mujoco.xml table scene (MuJoCoArm + MuJoCoGripper + MuJoCoPerception).

id: so101
display_name: "SO-101 (5-DoF tabletop arm)"
driver: mujoco_arm                # transitional (WP17: one generic driver)
world: tabletop           # config/worlds/tabletop.yaml

model:
  path: vector_os_nano/hardware/sim/so101_mujoco.xml
  root_body: base_link

spawn:
  # Fixed base bolted to the table scene (no free joint).
  xy: [0.0, 0.0]
  base_height: 0.02

# Home pose, by joint name (the arm_at_home oracle reads it from here).
stance:
  shoulder_pan:  -0.014
  shoulder_lift: -1.238
  elbow_flex:    0.562
  wrist_flex:    0.858
  wrist_roll:    0.311

sensors:
  - role: camera                  # in so101_mujoco.xml, fixed to the world
    name: overhead
    width: 640                    # MuJoCoPerception's render size
    height: 480

policy:
  ref: position_actuators         # MuJoCo position servos, no gait
  spec: {}

capabilities:
  has_base: false
  has_arm: true
  has_gripper: true
  camera: true
  lidar: false
