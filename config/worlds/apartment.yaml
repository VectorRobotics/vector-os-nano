# World manifest — the go2 apartment (vector_os_nano/hardware/sim/go2_room.xml).
# Loaded by vector_os_nano/vcli/worlds/world_manifest.py. Every body that stands in
# this house (go2, go2_piper, g1: robot.yaml `world: apartment`) shares it.
#
# SIM ONLY — on a real robot rooms come from mapping, objects from perception.
#
# rooms: room -> [x, y], a FREE floor point inside the room (a navigation goal, so
#   never inside furniture: the kitchen island sits on the room's geometric centre
#   (17, 2.5), the dining table on (3, 7.5)). Validated against the compiled scene
#   by tests/unit/sim/test_nav_apartment.py.
# boxes: room -> [x_min, y_min, x_max, y_max], derived once from the f_* floor geoms
#   (f_living, f_dining, f_kitchen, f_study, f_master, f_guest exactly; the bathroom
#   box adds the merged laundry east of f_bath; the hallway is the open centre span
#   with no floor geom). Checked against the MJCF by tests/unit/vcli/test_world_manifest.py.
# doors: "room_a-room_b" -> [x, y] doorway centre.

rooms:
  living_room:    [3.0,  2.5]
  dining_room:    [3.0,  9.2]
  kitchen:        [17.0, 1.7]
  study:          [17.0, 7.5]
  master_bedroom: [3.5,  12.0]
  guest_bedroom:  [16.0, 12.0]
  bathroom:       [9.5,  12.0]
  hallway:        [10.0, 5.0]

boxes:
  living_room:    [0.0,  0.0,  6.0,  5.0]
  dining_room:    [0.0,  5.0,  6.0,  10.0]
  kitchen:        [14.0, 0.0,  20.0, 5.0]
  study:          [14.0, 5.0,  20.0, 10.0]
  master_bedroom: [0.0,  10.0, 7.0,  14.0]
  guest_bedroom:  [12.0, 10.0, 20.0, 14.0]
  bathroom:       [7.0,  10.0, 12.0, 14.0]
  hallway:        [6.0,  0.0,  14.0, 10.0]

doors:
  living_room-hallway:    [6.5,  3.0]
  dining_room-hallway:    [6.5,  8.0]
  kitchen-hallway:        [13.5, 3.0]
  study-hallway:          [13.5, 8.0]
  master_bedroom-hallway: [3.0,  10.5]
  guest_bedroom-hallway:  [16.0, 10.0]
  bathroom-hallway:       [8.5,  10.0]

# Support surfaces: the MJCF body whose collision box carries objects, its top
# footprint [x_min, y_min, x_max, y_max] and top height z (m). object_on(obj, surface)
# needs the object resting in contact with that body above this height. aliases: what
# NL calls it (a place goal's task contract binds object_on to the surface it names;
# a bare "table" / "桌子" names none of these four and binds nothing).
surfaces:
  pick_table:    {body: pick_table,    box: [10.80, 2.75, 11.10, 3.25], height: 0.28,
                  aliases: [pick table, 取物台]}
  coffee_table:  {body: coffee_tbl,    box: [1.20,  1.95, 2.40,  2.65], height: 0.40,
                  aliases: [coffee table, 茶几]}
  dining_table:  {body: dining_table,  box: [2.16,  7.05, 3.84,  7.95], height: 0.66,
                  aliases: [dining table, 餐桌, 饭桌]}
  console_table: {body: console_table, box: [6.02,  4.80, 6.98,  5.20], height: 0.70,
                  aliases: [console table, 玄关桌]}

# Graspable objects: MJCF body name -> what NL calls it. The scene build adds one
# inactive grasp weld per entry (hardware/sim/scene_builder.room_scene), so a pickable is
# added by adding its MJCF body + an entry here.
pickables:
  pickable_bottle_green:
    category: bottle
    colour: green
    surface: pick_table
    aliases: [green bottle, 绿色瓶子, 绿色的瓶子, 绿瓶子]
  pickable_bottle_blue:
    category: bottle
    colour: blue
    surface: pick_table
    aliases: [blue bottle, 蓝色瓶子, 蓝色的瓶子, 蓝瓶子]
  pickable_can_red:
    category: can
    colour: red
    surface: pick_table
    aliases: [red can, 红色罐子, 红色的罐子, 红罐子, 红色易拉罐]
  pickable_cup_yellow:
    category: cup
    colour: yellow
    surface: coffee_table
    aliases: [yellow cup, 黄色杯子, 黄色的杯子, 黄杯子]
  pickable_box_orange:
    category: box
    colour: orange
    surface: dining_table
    aliases: [orange box, 橙色盒子, 橙色的盒子, 橙盒子]
  pickable_box_purple:
    category: box
    colour: purple
    surface: console_table
    aliases: [purple box, 紫色盒子, 紫色的盒子, 紫盒子]

# Words that name a colour / category in a query (zh + en), so "绿色的瓶子",
# "the green bottle" and "绿瓶" all resolve to pickable_bottle_green.
vocab:
  colours:
    green:  [green, 绿]
    blue:   [blue, 蓝]
    red:    [red, 红]
    yellow: [yellow, 黄]
    orange: [orange, 橙, 橘]
    purple: [purple, violet, 紫]
  categories:
    bottle: [bottle, 瓶]
    can:    [can, 罐]
    cup:    [cup, mug, 杯]
    box:    [box, 盒]
  # Furniture: a place goal's destination ("put it on the table") that names no surface
  # above (the slot binds None and the goal check fails, never unchecked). An object
  # reference needs no list of what is NOT an object: "red stool" resolves to nothing
  # because "stool" is no word of this world's pickables.
  scenery: [stool, chair, table, desk, sofa, couch, bed, shelf, cabinet, counter, fridge,
            door, wall, floor, lamp, rug, 凳, 椅, 桌, 台子, 沙发, 床, 柜, 架, 冰箱, 门, 墙, 地板, 灯, 毯]

# Where "bring it to me" delivers: a free hallway floor point west of the spawn.
user:
  xy: [8.0, 3.0]
  room: hallway
